<!-- contact-form.html -->
<section id="contact" class="py-20 bg-white">
    <div class="max-w-4xl mx-auto px-6">
        <h2 class="text-center text-3xl heading-font mb-4">Schedule Your Free Consultation</h2>
        <p class="text-center text-gray-600 mb-12">Speak directly with Anthony Burton today</p>

        <form class="grid md:grid-cols-2 gap-6" action="https://formspree.io/f/your-email-here" method="POST">
            <input type="text" name="name" placeholder="Your Name" required class="border border-gray-300 focus:border-[#c5a05b] px-6 py-4 rounded-xl">
            <input type="tel" name="phone" placeholder="Phone Number" required class="border border-gray-300 focus:border-[#c5a05b] px-6 py-4 rounded-xl">
            <input type="email" name="email" placeholder="Email Address" class="border border-gray-300 focus:border-[#c5a05b] px-6 py-4 rounded-xl md:col-span-2">
            <textarea name="message" rows="5" placeholder="Tell us about your situation..." class="border border-gray-300 focus:border-[#c5a05b] px-6 py-4 rounded-xl md:col-span-2"></textarea>
            <button type="submit" class="md:col-span-2 bg-[#c5a05b] hover:bg-amber-300 text-[#0a2540] font-semibold py-5 rounded-xl text-lg">
                SEND MESSAGE – I’LL CALL YOU TODAY
            </button>
        </form>
    </div>
</section>
